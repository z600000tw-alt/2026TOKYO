<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>東京旅行手帳 11/14–11/21</title>
<meta name="description" content="東京 7 晚 8 天旅行手帳：航班、每日行程、待辦清單、住宿與伴手禮。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --aqua:#A8D3E6; --green:#B9DAA5;
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:74px;-webkit-text-size-adjust:100%}
body{
  margin:0;padding-top:62px;background:var(--paper);color:var(--ink);
  font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;overflow-x:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
section{padding:30px 0 6px}

/* ---------- SVG 共用 ---------- */
.k{fill:none;stroke:var(--ink);stroke-width:var(--sw,3px);stroke-linejoin:round;stroke-linecap:round}
.k *{vector-effect:non-scaling-stroke}
.ico{width:34px;height:34px;flex:none;--sw:2.5px}
.ico.sm{width:24px;height:24px;--sw:2px}

/* ---------- 固定選單 ---------- */
.top{
  position:fixed;top:0;left:0;right:0;z-index:50;height:58px;
  background:var(--paper);border-bottom:3px solid var(--ink);
  display:flex;align-items:center;gap:8px;padding:0 12px;
}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;font-size:18px;font-weight:bold;flex:none}
.top nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px}
.top nav::-webkit-scrollbar{display:none}
.top nav a{
  flex:none;text-decoration:none;font-size:14px;padding:3px 12px;border:3px solid transparent;border-radius:999px;
  transition:background .2s,border-color .2s;
}
.top nav a.on{background:var(--yellow);border-color:var(--ink)}
@media (max-width:480px){.brand span{display:none}}

/* ---------- 區塊標題 ---------- */
h2.sec{
  display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:4px 20px 4px 8px;
  border:3px solid var(--ink);border-radius:999px;background:var(--c,var(--yellow));
  font-size:22px;line-height:1.3;box-shadow:0 3px 0 var(--ink);
}

/* ---------- 首頁 ---------- */
.hero{border:3px solid var(--ink);border-radius:32px;overflow:hidden;background:var(--paper);box-shadow:0 4px 0 var(--ink);margin-top:14px}
.hero svg{display:block;width:100%;height:auto;--sw:3px}
.hero-body{padding:16px 16px 20px;text-align:center}
.eyebrow{
  display:inline-block;margin:0 0 8px;padding:2px 16px;background:var(--yellow);
  border:3px solid var(--ink);border-radius:999px;font-size:14px;transform:rotate(-2deg);
}
h1{margin:0;font-size:34px;line-height:1.25}
.sub{margin:4px 0 16px;font-size:14px}
.cd-label{font-size:15px;margin-bottom:8px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{border:3px solid var(--ink);border-radius:18px;padding:8px 2px 6px;background:var(--c)}
.cd b{display:block;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.cd span{font-size:12px}
.cd.off{display:none}

/* ---------- 動畫 ---------- */
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift.b{animation-duration:12s;animation-delay:-3s}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
.float{animation:floaty 3.6s ease-in-out infinite alternate}
.float.b{animation-duration:4.6s;animation-delay:-1.5s}
@keyframes floaty{from{transform:translateY(-4px) rotate(-1.5deg)}to{transform:translateY(5px) rotate(1.5deg)}}
.sway{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall 9s linear infinite}
.fall.l2{animation-duration:12s;animation-delay:-4s}
.fall.l3{animation-duration:10s;animation-delay:-7s}
.fall.l4{animation-duration:14s;animation-delay:-2s}
@keyframes fall{
  0%{transform:translate(0,-30px) rotate(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translate(-34px,250px) rotate(300deg);opacity:0}
}
@keyframes bounceIn{
  0%{opacity:0;transform:translateY(26px) scale(.9)}
  55%{opacity:1;transform:translateY(-8px) scale(1.03)}
  78%{transform:translateY(3px) scale(.99)}
  100%{opacity:1;transform:none}
}
@keyframes pop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-7px) scale(1.12) rotate(-2deg)}70%{transform:translateY(-1px) scale(.96)}100%{transform:translateY(-3px) scale(1)}}
.pane.enter .banner,.pane.enter .tl-item,.pane.enter .day-h{animation:bounceIn .62s both}
.pane.enter .tl-item{animation-delay:calc(var(--i) * 55ms + 80ms)}
.tab.pop{animation:pop .45s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ---------- 航班 ---------- */
.fl{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--paper);box-shadow:0 4px 0 var(--ink);margin-bottom:18px}
.fl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--c);border-bottom:3px solid var(--ink);font-size:15px}
.fl-h b{font-size:17px}
.fl-b{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:16px 12px 14px;align-items:center}
.ap{text-align:center}
.ap .code{display:block;font-size:30px;line-height:1.1;font-weight:bold}
.ap .tm{display:block;font-size:22px;font-weight:bold}
.ap small{display:block;font-size:12px;line-height:1.35}
.mid{display:flex;flex-direction:column;align-items:center;min-width:64px}
.mid i{display:block;width:64px;border-top:3px dashed var(--ink);margin:4px 0 6px}
.mid small{font-size:12px}
.fl-f{border-top:3px dashed var(--ink);padding:8px 14px;font-size:13px;display:flex;justify-content:space-between;gap:8px}

/* ---------- 每日行程 ---------- */
.tabs{
  display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:8px 16px 14px;scroll-snap-type:x proximity;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;min-width:68px;scroll-snap-align:center;border:3px solid var(--ink);border-radius:20px;background:var(--paper);
  padding:6px 8px;text-align:center;cursor:pointer;line-height:1.25;
}
.tab small{display:block;font-size:11px}
.tab b{display:block;font-size:18px}
.tab span{font-size:12px}
.tab[aria-selected="true"]{background:var(--c);box-shadow:0 4px 0 var(--ink);transform:translateY(-3px)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:12px}
.banner{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.banner svg{display:block;width:100%;height:auto;--sw:3px}
.day-h{margin:0 0 14px}
.day-h h3{margin:0;font-size:22px;line-height:1.3}
.stay-line{margin:2px 0 0;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-block;padding:1px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);
  font-size:12px;line-height:1.55;white-space:nowrap;
}
.chip.train{background:var(--aqua)}
.chip.walk{background:var(--green)}
.chip.bus{background:var(--yellow)}
.chip.car,.chip.cable{background:var(--coral)}
.chip.coral{background:var(--coral)}.chip.yellow{background:var(--yellow)}.chip.aqua{background:var(--aqua)}.chip.green{background:var(--green)}
.chip.must{background:var(--coral);font-weight:bold;transform:rotate(-4deg);padding:1px 12px}
.chip.opt{border-style:dashed}
.chip.todo{border-style:dashed;background:var(--paper)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:67px;top:14px;bottom:20px;border-left:3px dashed var(--ink)}
.tl-item{display:grid;grid-template-columns:48px 26px 1fr;column-gap:6px;align-items:start;margin:0 0 14px;position:relative}
.time{text-align:right;font-size:13px;font-weight:bold;padding-top:12px;font-variant-numeric:tabular-nums}
.dot{width:22px;height:22px;margin:11px 0 0 2px;border:3px solid var(--ink);border-radius:50%;background:var(--dc,var(--green));position:relative;z-index:1}
.k-meal{--dc:var(--yellow)}.k-move{--dc:var(--aqua)}.k-stay{--dc:var(--coral)}.k-spot{--dc:var(--green)}
.tl-card{border:3px solid var(--ink);border-radius:20px;padding:9px 13px 10px;background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.k-meal .tl-card{background:#FBE9B8}
.k-stay .tl-card{background:#FBDCD5}
.ttl{font-weight:bold;font-size:16px;line-height:1.4}
.note{font-size:13px;margin-top:2px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.loc{display:flex;align-items:center;gap:4px;font-size:13px;margin-top:3px}

/* ---------- 勾選清單 ---------- */
.prog{margin-bottom:16px}
.prog p{margin:0 0 6px;font-size:15px}
.bar{height:20px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.bar i[style*="width:0%"]{border-right:0}
.card{border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:0 4px 0 var(--ink);margin-bottom:18px;overflow:hidden}
.card>h3{margin:0;padding:8px 16px;background:var(--c);border-bottom:3px solid var(--ink);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.card>h3 small{font-size:13px;font-weight:normal}
.card ul{list-style:none;margin:0;padding:6px 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed rgba(62,58,57,.35)}
.row:last-child{border-bottom:0}
.row label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .sub2{display:block;font-size:12px}
.row.done .nm{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;flex:none;width:28px;height:28px;margin:0;border:3px solid var(--ink);border-radius:10px;
  background:var(--paper);display:grid;place-content:center;cursor:pointer;transition:background .15s;
}
input[type=checkbox]:checked{background:var(--green)}
input[type=checkbox]:checked::after{content:"";width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bk-grp{padding:0 12px}
.bk-grp+.bk-grp{border-top:3px dashed var(--ink)}
.bk-grp ul{padding:0 0 4px}
.bk-h{margin:10px 2px 2px;display:flex;align-items:center;gap:8px;font-size:13px}
.bk-btn{
  flex:none;border:3px solid var(--ink);border-radius:999px;background:var(--paper);border-style:dashed;
  padding:3px 12px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--ink);
}
.bk-btn[aria-pressed="true"]{background:var(--green);border-style:solid}
.bk-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.row.booked .nm{opacity:.75}
.del{flex:none;width:28px;height:28px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer;line-height:1;font-size:16px;padding:0}
.add{display:flex;gap:8px;padding:4px 12px 12px;flex-wrap:wrap}
.add input[type=text],.add select{
  flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:5px 14px;font:inherit;color:inherit;
}
.add select{flex:0 0 auto;max-width:42%}
.btn{
  border:3px solid var(--ink);border-radius:999px;background:var(--yellow);padding:4px 16px;cursor:pointer;font-size:15px;
  text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--ink);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.link-row{padding:0 14px 12px;font-size:14px}

/* ---------- 住宿 ---------- */
.hotel-b{padding:12px 16px 14px;font-size:15px}
.hotel-b p{margin:0 0 4px}
.hotel-b .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stay-n{font-size:13px}

/* ---------- 伴手禮 ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 6px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:2px 14px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}

.foot{text-align:center;padding:30px 0 44px;font-size:14px}
.foot svg{width:84px;height:84px;--sw:2.5px;display:block;margin:0 auto 6px}
noscript{display:block;padding:20px;text-align:center}
</style>
</head>

var CATS=["伴手禮 / 零食","必吃美食 / 超商","藥妝 / 保健","雜貨 / 料理用"];
var CATCLS={"伴手禮 / 零食":"coral","必吃美食 / 超商":"yellow","藥妝 / 保健":"green","雜貨 / 料理用":"aqua"};

/* ---------- 狀態 ---------- */
var S={checks:{},bk:{},custom:{pre:[],pack:[],book:[],sv:[]},day:null};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var o=JSON.parse(raw);S.checks=o.checks||{};S.bk=o.bk||{};S.day=typeof o.day==="number"?o.day:null;
    S.custom=Object.assign({pre:[],pack:[],book:[],sv:[]},o.custom||{});}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- 倒數 ---------- */
var DEP=new Date("2026-11-14T10:10:00+08:00"),RET=new Date("2026-11-21T16:50:00+08:00");
function p2(n){return n<10?"0"+n:""+n}
function tick(){
  var now=new Date(),t,lab;
  var cd=$("#cd");
  if(now<DEP){t=DEP;lab="距離出發還有";}
  else if(now<RET){t=RET;lab="旅行進行中・距離回家還有";}
  else{$("#cdLabel").textContent="平安回到溫暖的家，旅途愉快！";cd.classList.add("off");return;}
  cd.classList.remove("off");
  var d=Math.max(0,t-now);
  $("#cdLabel").textContent=lab;
  $("#cdD").textContent=Math.floor(d/864e5);
  $("#cdH").textContent=p2(Math.floor(d%864e5/36e5));
  $("#cdM").textContent=p2(Math.floor(d%36e5/6e4));
  $("#cdS").textContent=p2(Math.floor(d%6e4/1e3));
}

/* ---------- 航班 ---------- */
function renderFlights(){
  $("#flightList").innerHTML=FLIGHTS.map(function(f){
    function ap(a){return '<div class="ap"><span class="code">'+a.code+'</span><span class="tm">'+a.time+'</span><small>'+esc(a.name)+'<br>'+esc(a.t)+'</small></div>'}
    return '<article class="fl"><div class="fl-h" style="--c:'+f.c+'"><span><b>'+f.dir+'</b>　'+f.date+'</span><span>'+f.al+' <b>'+f.no+'</b></span></div>'+
      '<div class="fl-b">'+ap(f.from)+'<div class="mid"><svg class="ico sm" aria-hidden="true"><use href="#s-plane"/></svg><i></i><small>'+f.dur+'</small></div>'+ap(f.to)+'</div>'+
      '<div class="fl-f"><span>當地時間</span><span>'+(f.dir==="去程"?"記得線上報到":"回程前一天確認班機時間")+'</span></div></article>';
  }).join("");
}

/* ---------- 每日行程 ---------- */
function banner(d){
  var s='<svg viewBox="0 0 320 120" role="img" aria-label="'+esc(d.alt)+'"><rect width="320" height="120" fill="'+d.bg+'"/><rect y="100" width="320" height="20" fill="#FFFCF6"/><g class="k"><path d="M0 100 H320"/></g>';
  d.art.forEach(function(a){
    var h=a[5]||a[3];
    var u='<use href="#'+a[0]+'" x="'+a[1]+'" y="'+a[2]+'" width="'+a[3]+'" height="'+h+'"/>';
    s+=a[4]?'<g class="'+a[4]+'">'+u+'</g>':u;
  });
  return s+(d.extra||"")+'</svg>';
}
function hotelLink(key){
  var h=HOTELS[key];
  return '<a href="'+h.url+'" target="_blank" rel="noopener">'+esc(h.label||h.name)+'</a>';
}
function renderTabs(){
  $("#tabs").innerHTML=DAYS.map(function(d,i){
    return '<button class="tab" role="tab" id="tab'+i+'" aria-selected="false" aria-controls="pane" tabindex="-1" data-i="'+i+'" style="--c:'+COLORS[i%4]+'"><small>DAY '+(i+1)+'</small><b>'+d.d+'</b><span>'+d.w+'</span></button>';
  }).join("");
}
function renderDay(i,animate){
  var d=DAYS[i];
  var html='<div class="banner">'+banner(d)+'</div>'+
    '<div class="day-h"><h3>Day '+(i+1)+'・'+d.d+'（'+d.w+'）'+esc(d.title)+'</h3>'+
    (d.stay?'<p class="stay-line"><svg class="ico sm" aria-hidden="true"><use href="#s-pin"/></svg>今晚住宿：'+hotelLink(d.stay)+'</p>':'<p class="stay-line">最後一天，帶著滿滿的回憶回家</p>')+'</div>'+
    '<ol class="tl">'+d.items.map(function(it,j){
      var chips="";
      if(it.opt)chips+='<span class="chip opt">選配</span>';
      (it.tr||[]).forEach(function(t){chips+='<span class="chip '+t[0]+'">'+esc(t[1])+'</span>'});
      if(it.bid){var ok=isB(it.bid);chips+='<span class="chip '+(ok?'green':'todo')+'">'+(ok?'已訂位 ✓':'未訂位')+'</span>';}
      return '<li class="tl-item k-'+it.k+'" style="--i:'+j+'"><div class="time">'+(it.t||"")+'</div><div class="dot"></div><div class="tl-card"><div class="ttl">'+esc(it.n)+'</div>'+
        (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+
        (it.loc?'<div class="loc"><svg class="ico sm" aria-hidden="true"><use href="#s-pin"/></svg>'+esc(it.loc)+'</div>':'')+
        (chips?'<div class="meta">'+chips+'</div>':'')+'</div></li>';
    }).join("")+'</ol>';
  var pane=$("#pane");
  pane.innerHTML=html;
  pane.setAttribute("aria-labelledby","tab"+i);
  pane.classList.remove("enter");
  if(animate){void pane.offsetWidth;pane.classList.add("enter");}
}
function selectDay(i,opts){
  opts=opts||{};
  S.day=i;save();
  document.querySelectorAll(".tab").forEach(function(b){
    var on=+b.dataset.i===i;
    b.setAttribute("aria-selected",on?"true":"false");
    b.tabIndex=on?0:-1;
    b.classList.remove("pop");
    if(on&&opts.animate){void b.offsetWidth;b.classList.add("pop");}
  });
  renderDay(i,!!opts.animate);
  var tb=$("#tab"+i);
  if(opts.scroll!==false&&tb&&tb.scrollIntoView){
    tb.scrollIntoView({inline:"center",block:"nearest",behavior:reduceMq.matches?"auto":"smooth"});
  }
  if(opts.focus)tb.focus();
}

/* ---------- 待辦 ---------- */
function allTodo(g){
  var base=g.items.map(function(x){return {id:x[0],n:x[1],m:x[2]||"",c:false,def:!!x[3]}});
  var cus=(S.custom[g.k]||[]).map(function(x){return {id:x.id,n:x.n,m:"",c:true}});
  return base.concat(cus);
}
function rowHtml(it,key){
  var done=!!S.checks[it.id];
  return '<li class="row'+(done?" done":"")+'"><label><input type="checkbox" data-k="'+it.id+'"'+(done?" checked":"")+'><span class="nm">'+esc(it.n)+(it.m?'<small class="sub2">'+esc(it.m)+'</small>':'')+(it.shop?'':'')+'</span></label>'+
    (it.c?'<button class="del" type="button" data-del="'+key+'" data-id="'+it.id+'" aria-label="刪除 '+esc(it.n)+'">×</button>':'')+'</li>';
}
var BKDEF={};TODO.forEach(function(g){if(g.k==="book")g.items.forEach(function(x){BKDEF[x[0]]=!!x[3]})});
function isB(id){return S.bk.hasOwnProperty(id)?!!S.bk[id]:!!BKDEF[id]}
function bookRow(it){
  var on=isB(it.id);
  return '<li class="row bk'+(on?" booked":"")+'"><span class="nm">'+esc(it.n)+(it.m?'<small class="sub2">'+esc(it.m)+'</small>':'')+'</span>'+
    '<button type="button" class="bk-btn" data-bk="'+it.id+'" aria-pressed="'+on+'" aria-label="'+esc(it.n)+'：'+(on?'已訂位，點一下改回未訂位':'未訂位，點一下改成已訂位')+'">'+(on?'已訂位 ✓':'未訂位')+'</button>'+
    (it.c?'<button class="del" type="button" data-del="book" data-id="'+it.id+'" aria-label="刪除 '+esc(it.n)+'">×</button>':'')+'</li>';
}
function bookCard(g){
  var its=allTodo(g);
  var yes=its.filter(function(x){return isB(x.id)}),no=its.filter(function(x){return !isB(x.id)});
  return {n:its.length,d:yes.length,html:'<div class="card"><h3 style="--c:'+g.c+'">'+g.t+'<small>已訂 '+yes.length+' / '+its.length+'</small></h3>'+
    '<div class="bk-grp"><p class="bk-h"><span class="chip todo">未訂位</span>'+no.length+' 項</p><ul>'+(no.map(bookRow).join("")||'<li class="row"><span class="nm">全部都訂好了！</span></li>')+'</ul></div>'+
    '<div class="bk-grp"><p class="bk-h"><span class="chip green">已訂位</span>'+yes.length+' 項</p><ul>'+(yes.map(bookRow).join("")||'<li class="row"><span class="nm sub2">還沒有已訂位的項目</span></li>')+'</ul></div>'+
    '<form class="add" data-g="'+g.k+'" autocomplete="off"><input type="text" name="n" maxlength="40" placeholder="新增要預約的項目…" required aria-label="新增到'+g.t+'"><button class="btn" type="submit">加入</button></form></div>'};
}
function renderTodo(){
  var total=0,done=0;
  $("#todoList").innerHTML=TODO.map(function(g){
    if(g.k==="book"){var bc=bookCard(g);total+=bc.n;done+=bc.d;return bc.html;}
    var its=allTodo(g);
    var dn=its.filter(function(x){return S.checks[x.id]}).length;
    total+=its.length;done+=dn;
    return '<div class="card"><h3 style="--c:'+g.c+'">'+g.t+'<small>'+dn+' / '+its.length+'</small></h3><ul>'+its.map(function(x){return rowHtml(x,g.k)}).join("")+'</ul>'+
      (g.link?'<div class="link-row"><a href="'+g.link.u+'" target="_blank" rel="noopener">'+esc(g.link.t)+' ↗</a></div>':'')+
      '<form class="add" data-g="'+g.k+'" autocomplete="off"><input type="text" name="n" maxlength="40" placeholder="新增項目…" required aria-label="新增到'+g.t+'"><button class="btn" type="submit">加入</button></form></div>';
  }).join("");
  $("#progText").textContent="完成 "+done+" / "+total+(total&&done===total?"　全部搞定！":"");
  var pct=total?Math.round(done/total*100):0;
  $("#progBar").style.width=pct+"%";
}

/* ---------- 住宿 ---------- */
function renderHotels(){
  $("#hotelList").innerHTML=HOTEL_CARDS.map(function(c){
    var h=HOTELS[c.key];
    return '<article class="card"><h3 style="--c:'+c.c+'">'+esc(h.name)+'<small>'+c.area+'</small></h3><div class="hotel-b">'+
      '<p><b>'+c.dates+'</b>　共 '+c.nights+' 晚</p>'+(c.room?'<p>'+esc(c.room)+'</p>':'')+
      '<div class="acts"><a class="btn" href="'+h.url+'" target="_blank" rel="noopener">'+c.site+'</a>'+
      '<a class="btn" style="background:var(--aqua)" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.map)+'" target="_blank" rel="noopener">地圖</a></div></div></article>';
  }).join("")+'<p class="stay-n">※ 入住與退房日期依每日行程推算，請以訂房確認信為準。</p>';
}

/* ---------- 伴手禮 ---------- */
var svFilter="全部";
function svAll(){
  return SV.map(function(x){return Object.assign({c:false},x)}).concat((S.custom.sv||[]).map(function(x){return Object.assign({c:true},x)}));
}
function renderSv(){
  var all=svAll();
  all.forEach(function(x){if(CATS.indexOf(x.cat)<0)x.cat=CATS[0]});
  var cats=["全部"].concat(CATS);
  $("#svFilters").innerHTML=cats.map(function(s){return '<button type="button" data-f="'+esc(s)+'" aria-pressed="'+(s===svFilter)+'">'+esc(s)+'</button>'}).join("");
  var list=all.filter(function(x){return svFilter==="全部"||x.cat===svFilter});
  var done=all.filter(function(x){return S.checks[x.id]}).length;
  $("#svText").textContent="已買 "+done+" / "+all.length;
  $("#svList").innerHTML=list.map(function(x){
    var on=!!S.checks[x.id];
    return '<li class="row'+(on?" done":"")+'"><label><input type="checkbox" data-k="'+x.id+'"'+(on?" checked":"")+'><span class="nm">'+esc(x.n)+
      (x.shop?'<small class="sub2">購買點：'+esc(x.shop)+'</small>':'')+
      (x.desc?'<small class="sub2">'+esc(x.desc)+'</small>':'')+'</span></label>'+
      (svFilter==="全部"?'<span class="chip '+(CATCLS[x.cat]||"")+'">'+esc(x.cat.split(" / ")[0])+'</span>':'')+
      (x.c?'<button class="del" type="button" data-del="sv" data-id="'+x.id+'" aria-label="刪除 '+esc(x.n)+'">×</button>':'')+'</li>';
  }).join("")||'<li class="row"><span class="nm">這個分類還沒有項目</span></li>';
}

/* ---------- 事件 ---------- */
function bind(){
  var tabs=$("#tabs");
  tabs.addEventListener("click",function(e){
    var b=e.target.closest(".tab");if(!b)return;
    selectDay(+b.dataset.i,{animate:true});
  });
  tabs.addEventListener("keydown",function(e){
    var i=S.day==null?0:S.day,n=DAYS.length;
    if(e.key==="ArrowRight"){selectDay((i+1)%n,{animate:true,focus:true});e.preventDefault();}
    else if(e.key==="ArrowLeft"){selectDay((i+n-1)%n,{animate:true,focus:true});e.preventDefault();}
  });
  document.addEventListener("change",function(e){
    var k=e.target&&e.target.dataset&&e.target.dataset.k;if(!k)return;
    if(e.target.checked)S.checks[k]=1;else delete S.checks[k];
    save();renderTodo();renderSv();
  });
  document.addEventListener("click",function(e){
    var bk=e.target.closest(".bk-btn");
    if(bk){
      var id=bk.dataset.bk;
      var nv=!isB(id);
      if(nv===!!BKDEF[id])delete S.bk[id];else S.bk[id]=nv?1:0;
      save();renderTodo();if(S.day!=null)renderDay(S.day,false);
      var nb=document.querySelector('[data-bk="'+id+'"]');if(nb)nb.focus();
      return;
    }
    var d=e.target.closest(".del");
    if(d){
      var key=d.dataset.del,id=d.dataset.id;
      S.custom[key]=(S.custom[key]||[]).filter(function(x){return x.id!==id});
      delete S.checks[id];save();renderTodo();renderSv();return;
    }
    var f=e.target.closest("#svFilters button");
    if(f){svFilter=f.dataset.f;renderSv();}
  });
  document.addEventListener("submit",function(e){
    var form=e.target;
    if(form.id==="svForm"){
      e.preventDefault();
      var n=form.n.value.trim();if(!n)return;
      var sh=form.where.value.trim();
      S.custom.sv.push({id:"c"+Date.now(),n:n,cat:form.cat.value,shop:sh});
      save();form.reset();renderSv();return;
    }
    if(form.dataset.g){
      e.preventDefault();
      var v=form.n.value.trim();if(!v)return;
      var g=form.dataset.g;
      S.custom[g].push({id:"c"+Date.now(),n:v});
      save();renderTodo();
    }
  });
  var sel=$("#svForm select");
  sel.innerHTML=CATS.map(function(s){return '<option>'+s+'</option>'}).join("");
  /* 選單高亮 */
  var links={};document.querySelectorAll("#nav a").forEach(function(a){links[a.dataset.s]=a});
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){
          Object.keys(links).forEach(function(k){links[k].classList.remove("on")});
          var a=links[en.target.dataset.sec];
          if(a){a.classList.add("on");
            if(a.scrollIntoView)a.scrollIntoView({inline:"center",block:"nearest",behavior:"auto"});}
        }
      });
    },{rootMargin:"-45% 0px -50% 0px"});
    document.querySelectorAll("[data-sec]").forEach(function(s){io.observe(s)});
  }
}

/* ---------- 啟動 ---------- */
renderFlights();renderTabs();renderTodo();renderHotels();renderSv();bind();
(function(){
  var start=0,now=new Date();
  var md=p2(now.getMonth()+1)+"/"+p2(now.getDate());
  var hit=DAYS.findIndex(function(d){return d.d===md});
  if(now.getFullYear()===2026&&hit>=0)start=hit;
  else if(typeof S.day==="number"&&S.day>=0&&S.day<DAYS.length)start=S.day;
  selectDay(start,{animate:false,scroll:false});
  var t=$("#tab"+start);
  if(t&&t.parentNode){t.parentNode.scrollLeft=Math.max(0,t.offsetLeft-t.parentNode.clientWidth/2+t.offsetWidth/2);}
})();
tick();setInterval(tick,1000);
})();
</script>
